<svg width="800" height="80" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #000000; }
    .footer-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      fill: #555555;
      text-anchor: middle;
      letter-spacing: 4px;
    }
    .eof {
      font-family: 'Courier New', Courier, monospace;
      font-size: 20px;
      font-weight: bold;
      fill: #FFFFFF;
      text-anchor: middle;
      letter-spacing: 8px;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .scanline {
      fill: #FFFFFF;
      opacity: 0.02;
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-80px); }
      100% { transform: translateY(80px); }
    }
    .line {
      stroke: #222222;
      stroke-width: 1;
      stroke-dasharray: 2 4;
    }
    .dot {
      fill: #333333;
      animation: dot-fade 2s infinite alternate;
    }
    .dot2 {
      fill: #333333;
      animation: dot-fade 2s infinite alternate 0.5s;
    }
    .dot3 {
      fill: #333333;
      animation: dot-fade 2s infinite alternate 1s;
    }
    @keyframes dot-fade {
      0% { fill: #222222; }
      100% { fill: #555555; }
    }
  </style>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="8" class="scanline" />

  <line x1="100" y1="25" x2="340" y2="25" class="line" />
  <line x1="460" y1="25" x2="700" y2="25" class="line" />

  <text x="400" y="30" class="eof">EOF</text>

  <g transform="translate(400, 55)">
    <circle cx="-12" cy="0" r="2" class="dot" />
    <circle cx="0" cy="0" r="2" class="dot2" />
    <circle cx="12" cy="0" r="2" class="dot3" />
  </g>

  <text x="400" y="72" class="footer-text">process terminated</text>
</svg>
