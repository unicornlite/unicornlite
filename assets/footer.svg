<svg viewBox="0 0 800 120" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #000000; }
    .footer-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 4px;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .scanline {
      fill: #FFFFFF;
      opacity: 0.02;
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-120px); }
      100% { transform: translateY(120px); }
    }
    .line {
      stroke: #222222;
      stroke-width: 1;
      stroke-dasharray: 2 4;
    }
    .eye-glow {
      fill: #FFFFFF;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.1; }
      100% { opacity: 1; }
    }
  </style>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="8" class="scanline" />

  <line x1="100" y1="50" x2="300" y2="50" class="line" />
  <line x1="500" y1="50" x2="700" y2="50" class="line" />

  <g transform="translate(350, 50)">
    <!-- Left Eye Box -->
    <rect x="0" y="0" width="24" height="8" fill="#333333" />
    <rect x="0" y="-8" width="24" height="8" fill="#111111" />
    <rect x="0" y="8" width="24" height="8" fill="#111111" />
    <rect x="-8" y="0" width="8" height="8" fill="#111111" />
    <rect x="24" y="0" width="8" height="8" fill="#111111" />
    <!-- Left Pupil -->
    <rect x="8" y="0" width="8" height="8" class="eye-glow" />

    <!-- Right Eye Box -->
    <rect x="76" y="0" width="24" height="8" fill="#333333" />
    <rect x="76" y="-8" width="24" height="8" fill="#111111" />
    <rect x="76" y="8" width="24" height="8" fill="#111111" />
    <rect x="68" y="0" width="8" height="8" fill="#111111" />
    <rect x="100" y="0" width="8" height="8" fill="#111111" />
    <!-- Right Pupil -->
    <rect x="84" y="0" width="8" height="8" class="eye-glow" />
  </g>

  <text x="400" y="100" class="footer-text">connection terminated <tspan class="cursor">_</tspan></text>
</svg>
