      <rect x="4" y="-6" width="8" height="4" class="pixel-grey" />
      <rect x="-16" y="-2" width="8" height="4" class="pixel" />
      <rect x="8" y="-2" width="8" height="4" class="pixel" />
      <rect x="-16" y="2" width="32" height="4" class="pixel-grey" />
      <rect x="-8" y="6" width="16" height="4" class="pixel-dark" />
