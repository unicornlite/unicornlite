      <rect x="-12" y="-8" width="4" height="16" class="pixel" />
      <rect x="8" y="-8" width="4" height="8" class="pixel-grey" />
      <rect x="-8" y="0" width="12" height="4" class="pixel-grey" />
      <rect x="-12" y="8" width="24" height="4" class="pixel" />
