      <rect x="-12" y="-4" width="8" height="4" class="pixel" />
      <rect x="-12" y="0" width="24" height="4" class="pixel-grey" />
      <rect x="-12" y="4" width="8" height="4" class="pixel-grey" />
      <rect x="4" y="4" width="8" height="4" class="pixel-grey" />
