      <rect x="-16" y="-4" width="8" height="4" class="pixel" />
      <rect x="8" y="-4" width="8" height="4" class="pixel" />
      <rect x="-16" y="0" width="32" height="4" class="pixel-grey" />
      <rect x="-12" y="4" width="8" height="4" class="pixel-dark" />
      <rect x="4" y="4" width="8" height="4" class="pixel-dark" />
    </g>
    <text x="36" y="62" class="icon-text t1">HTML5</text>
