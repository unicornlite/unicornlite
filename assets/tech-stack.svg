<svg viewBox="0 0 800 480" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #000000; }
    .label {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #ffffff;
      text-anchor: middle;
      letter-spacing: 3px;
    }
    .icon-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      fill: #555555;
      text-anchor: middle;
    }
    .t1 { animation: glow 3s ease-in-out infinite 0.0s; }
    .t2 { animation: glow 3s ease-in-out infinite 0.25s; }
    .t3 { animation: glow 3s ease-in-out infinite 0.5s; }
    .t4 { animation: glow 3s ease-in-out infinite 0.75s; }
    .t5 { animation: glow 3s ease-in-out infinite 1.0s; }
    .t6 { animation: glow 3s ease-in-out infinite 1.25s; }
    .t7 { animation: glow 3s ease-in-out infinite 1.5s; }
    .t8 { animation: glow 3s ease-in-out infinite 1.75s; }
    .t9 { animation: glow 3s ease-in-out infinite 2.0s; }
    .t10 { animation: glow 3s ease-in-out infinite 2.25s; }
    .t11 { animation: glow 3s ease-in-out infinite 2.5s; }
    .t12 { animation: glow 3s ease-in-out infinite 2.75s; }
    @keyframes glow {
      0%, 100% { fill: #333333; }
      50% { fill: #ffffff; }
    }
    .icon-box {
      fill: none;
      stroke: #333333;
      stroke-width: 1;
    }
    .b1 { animation: box-glow 3s ease-in-out infinite 0.0s; }
    .b2 { animation: box-glow 3s ease-in-out infinite 0.25s; }
    .b3 { animation: box-glow 3s ease-in-out infinite 0.5s; }
    .b4 { animation: box-glow 3s ease-in-out infinite 0.75s; }
    .b5 { animation: box-glow 3s ease-in-out infinite 1.0s; }
    .b6 { animation: box-glow 3s ease-in-out infinite 1.25s; }
    .b7 { animation: box-glow 3s ease-in-out infinite 1.5s; }
    .b8 { animation: box-glow 3s ease-in-out infinite 1.75s; }
    .b9 { animation: box-glow 3s ease-in-out infinite 2.0s; }
    .b10 { animation: box-glow 3s ease-in-out infinite 2.25s; }
    .b11 { animation: box-glow 3s ease-in-out infinite 2.5s; }
    .b12 { animation: box-glow 3s ease-in-out infinite 2.75s; }
    @keyframes box-glow {
      0%, 100% { stroke: #222222; }
      50% { stroke: #ffffff; }
    }
    .pixel { fill: #FFFFFF; }
    .pixel-grey { fill: #ffffff; }
    .pixel-dark { fill: #555555; }
    .scanline {
      fill: #FFFFFF;
      opacity: 0.02;
      animation: scan 5s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(-480px); }
      100% { transform: translateY(480px); }
    }
    .glitch-line {
      fill: #FFFFFF;
      opacity: 0;
      animation: glitch-flash 8s infinite;
    }
    @keyframes glitch-flash {
      0%, 94%, 100% { opacity: 0; }
      95% { opacity: 0.08; transform: translateX(-200px); }
      96% { opacity: 0; }
      97% { opacity: 0.05; transform: translateX(100px); }
      98% { opacity: 0; }
    }
    .separator {
      stroke: #222222;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
  </style>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="12" class="scanline" />
  <rect width="100%" height="12" class="scanline" y="-240" />
  <rect width="100%" height="3" y="180" class="glitch-line" />
  <rect width="100%" height="2" y="350" class="glitch-line" />

  <text x="400" y="40" class="label">[ FRONTEND ]</text>
  <line x1="200" y1="50" x2="600" y2="50" class="separator" />

  <g transform="translate(134, 70)">
    <rect x="0" y="0" width="72" height="72" class="icon-box b1" rx="3" />
    <g transform="translate(36, 28)">
