<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="100%">
  <style>
    .bg { fill: #000000; }
    .pixel { fill: #ffffff; }
    .pixel-dark { fill: #555555; }
    @keyframes glitch {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 2px); }
      40% { transform: translate(-2px, -4px); }
      60% { transform: translate(4px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0, 0); }
    }
    .skull {
      animation: glitch 0.2s infinite;
    }
    .skull-clone {
      fill: #333333;
      animation: glitch 0.3s infinite reverse;
      opacity: 0.5;
    }
    .text {
      fill: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 4px;
    }
  </style>

  <rect width="600" height="250" class="bg" />

  <!-- Pixel Art Skull Group -->
  <g transform="translate(230, 40) scale(10)">
    
    <!-- Background Glitch Clone -->
    <g class="skull-clone" transform="translate(-0.5, 0)">
      <rect x="4" y="0" width="6" height="1"/>
      <rect x="2" y="1" width="10" height="1"/>
      <rect x="1" y="2" width="12" height="1"/>
      <rect x="0" y="3" width="14" height="4"/>
      <rect x="1" y="7" width="12" height="2"/>
      <rect x="3" y="9" width="8" height="1"/>
      <rect x="3" y="10" width="8" height="1"/>
      <rect x="3" y="11" width="8" height="1"/>
    </g>

    <!-- Main Skull -->
    <g class="skull">
      <rect class="pixel" x="4" y="0" width="6" height="1"/>
      <rect class="pixel" x="2" y="1" width="10" height="1"/>
      <rect class="pixel" x="1" y="2" width="12" height="1"/>
      
      <!-- Forehead -->
      <rect class="pixel" x="0" y="3" width="14" height="1"/>
      
      <!-- Eyes Row 1 -->
      <rect class="pixel" x="0" y="4" width="3" height="1"/>
      <rect class="pixel" x="5" y="4" width="4" height="1"/>
      <rect class="pixel" x="11" y="4" width="3" height="1"/>
      
      <!-- Eyes Row 2 -->
      <rect class="pixel" x="0" y="5" width="2" height="1"/>
      <rect class="pixel" x="6" y="5" width="2" height="1"/>
      <rect class="pixel" x="12" y="5" width="2" height="1"/>

      <!-- Nose Row -->
      <rect class="pixel" x="0" y="6" width="14" height="1"/>
      
      <!-- Upper Jaw -->
      <rect class="pixel" x="1" y="7" width="5" height="1"/>
      <rect class="bg" x="6" y="7" width="2" height="1"/>
      <rect class="pixel" x="8" y="7" width="5" height="1"/>

      <!-- Cheekbones -->
      <rect class="pixel" x="2" y="8" width="10" height="1"/>

      <!-- Teeth -->
      <rect class="pixel" x="3" y="9" width="1" height="1"/>
      <rect class="pixel" x="5" y="9" width="1" height="1"/>
      <rect class="pixel" x="8" y="9" width="1" height="1"/>
      <rect class="pixel" x="10" y="9" width="1" height="1"/>

      <rect class="pixel" x="3" y="10" width="1" height="1"/>
      <rect class="pixel" x="5" y="10" width="1" height="1"/>
      <rect class="pixel" x="8" y="10" width="1" height="1"/>
      <rect class="pixel" x="10" y="10" width="1" height="1"/>

      <rect class="pixel" x="3" y="11" width="8" height="1"/>
    </g>
  </g>

  <!-- Glitchy Error Text -->
  <text x="50%" y="210" text-anchor="middle" class="text">SYS_HALT</text>
  <text x="50%" y="230" text-anchor="middle" class="text" style="opacity: 0.5; font-size: 10px;">[ MEMORY CORRUPTION ]</text>
</svg>